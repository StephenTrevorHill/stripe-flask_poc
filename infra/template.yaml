AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda → SQS → Lambda with DynamoDB (staging/prod) – free tier

Parameters:
  Stage:
    Type: String
    Default: staging

  StripeWebhookSecretValue:
    Type: String
    NoEcho: true
    Description: The actual Stripe webhook secret value

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref EventsTable

Resources:
  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub events-${Stage}-dlq

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub events-${Stage}
      VisibilityTimeout: 90            # ≈ 6× processor Lambda timeout (15s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDLQ.Arn
        maxReceiveCount: 5

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub events-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1_TenantCreatedAt
          KeySchema:
            - AttributeName: tenantId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [status, type]

  StripeWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: stripe-webhook-secret
      Description: Stripe webhook secret for validation
      SecretString: !Ref StripeWebhookSecretValue

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref StripeWebhookSecret

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src.handlers.ingest.handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventsQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Environment:
        Variables:
          QUEUE_URL: !Ref EventsQueue    # Ref on SQS returns QueueUrl
          SECRET_ARN: !Ref StripeWebhookSecret  # Remove the problematic STRIPE_WEBHOOK_SECRET line
          
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /webhook
            Method: POST

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src.handlers.process.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        FromSQS:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures   # enable partial batch response

Outputs:
  ApiEndpoint:
    Description: Invoke URL for POST /webhook
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook'
  SecretArn:
    Description: ARN of the Stripe webhook secret
    Value: !Ref StripeWebhookSecret