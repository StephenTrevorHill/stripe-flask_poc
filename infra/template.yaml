AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda → SQS → Lambda with DynamoDB (staging/prod) – free tier

Parameters:
  Stage:
    Type: String
    AllowedValues: [staging, prod]
    Default: staging

Conditions:
  IsStaging: !Equals [!Ref Stage, "staging"]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
    Tracing: Active

Resources:
  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub events-${Stage}-dlq

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub events-${Stage}
      VisibilityTimeout: 90            
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDLQ.Arn
        maxReceiveCount: 5

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "events-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "payments-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: paymentId
          AttributeType: S
        - AttributeName: orderId         # for a simple query-by-order GSI
          AttributeType: S
      KeySchema:
        - AttributeName: paymentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byOrder
          KeySchema:
            - AttributeName: orderId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "orders-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src.handlers.ingest.handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !Sub "events-${Stage}"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stripe/webhook/${Stage}-*"
      Environment:
        Variables:
          QUEUE_URL: !Ref EventsQueue
          STRIPE_SECRET_ID: !Sub "stripe/webhook/${Stage}"
          LOG_LEVEL: !If [IsStaging, "DEBUG", "INFO"]
      Events:
        Api:
          Type: Api
          Properties:
            Path: /webhook
            Method: POST

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src.handlers.process.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref EventsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PaymentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
      Environment:
        Variables:
          EVENTS_TABLE:   !Ref EventsTable
          PAYMENTS_TABLE: !Ref PaymentsTable
          ORDERS_TABLE:   !Ref OrdersTable
          LOG_LEVEL: !If [IsStaging, "DEBUG", "INFO"]
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhook"
  EventsTableName:   { Value: !Ref EventsTable }
  PaymentsTableName: { Value: !Ref PaymentsTable }
  OrdersTableName:   { Value: !Ref OrdersTable }